name: Frontend Preview CI/CD

concurrency:
  group: ${{ github.ref }}-frontend-dev
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-dev.yaml"

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main

      #   - name: Install Vercel
      #     # run: nix profile install nixpkgs#{nodePackages.vercel}
      #       run: |
      #         nix develop --impure --accept-flake-config --show-trace --command /bin/bash -c \
      #           'cd frontend && pnpm install'

      - name: Pull Vercel Environment Information
        run: |
          nix develop --impure --accept-flake-config --show-trace --command /bin/bash -c \
            'vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}'

      - name: Build Project Artifacts
        run: |
          nix develop --impure --accept-flake-config --show-trace --command /bin/bash -c \
            'vercel build --token=${{ secrets.VERCEL_TOKEN }}'

      - name: Deploy Project Artifacts to Vercel
        run: |
          nix develop --impure --accept-flake-config --show-trace --command /bin/bash -c \
            'vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}'
