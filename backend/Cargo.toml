[package]
name = "strikefi"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
rocket = "0.5.0"
shuttle-rocket = "0.52.0"
shuttle-runtime = "0.52.0"
tokio = { version = "1.26.0", features = ["full"] }
sqlx = { version = "0.8.3", features = [
  "postgres",
  "runtime-tokio",
  "tls-native-tls",
] }

# Using the local sui-sdk from the .sui-repo directory
sui-sdk = { path = "../.sui-repo/crates/sui-sdk" }
